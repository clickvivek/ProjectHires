<div class="search-job-wrapper adv-filter-wrapper pb-4 pt-0">
  <div class="container">
    <div class="row justify-content-center">

      <div class="col-12 col-lg-10 col-xl-8 text-center pt-0 pb-3">
        <h2 class="fw-bold mb-3" style="color: #11111D; letter-spacing: -0.5px; font-size: 1.35rem;">Search from thousands of tech Jobs posted everyday</h2>
        <div class="mb-4">
          <search-skill-location
            [skill]="skill"
            [location]="location"
            [cityId]="cityId"
            type="jobs"
          ></search-skill-location>
        </div>
      </div>

      <div class="col-md-12">

        <loader *ngIf="!isLoaded"></loader>

        <ng-container *ngIf="isLoaded">

          <div class="mt-2 alert alert-danger" *ngIf="isError">
            {{ error }}
          </div>

          <ng-container *ngIf="isDataAvailable">
            
            <div class="options-box">
              <h6>{{ skill }} - {{ totalItems }} jobs found</h6>
            </div>
            

            <div class="list-container">

              <adv-filter-card>
                <adv-filter-date-posted
                  (inputChange)="onDateFilter($event)"
                ></adv-filter-date-posted>
                <adv-filter-visa
                  (inputChange)="onVisaFilter($event)"
                ></adv-filter-visa>
                <adv-filter-experience-level
                  (inputChange)="onExpFilter($event)"
                ></adv-filter-experience-level>
                <adv-filter-work-model
                  (inputChange)="onWorkModeFilter($event)"
                ></adv-filter-work-model>
                <adv-filter-reset></adv-filter-reset>
              </adv-filter-card>

              <div class="content" *ngIf="jobData.length > 0">

                <div class="left-area">
                  <div class="left-box">
                    <div class="section shadow">
                      <ng-container
                        *ngFor="
                          let job of jobData | slice : ItemStartIndex : ItemEndIndex
                        "
                      >
                        <li
                          class="list-group-item item"
                          (click)="showJobDescription(job)"
                          [ngClass]="isSelected(job.jobOpeningId)"
                        >
                          <div class="holder">
                            <img
                              *ngIf="job.companyLogo"
                              [src]="getCompanyLogoUrl(job.companyLogo)"
                              [alt]="job.companyName || 'Company Logo'"
                              class="company-logo-img"
                              (error)="$any($event.target).style.display='none'; holderFallback.style.display='flex'"
                            />
                            <div
                              #holderFallback
                              class="holder-fallback"
                              [style.display]="job.companyLogo ? 'none' : 'flex'"
                            >
                              <span class="text-h5">{{ getCompanyInitial(job.companyName) }}</span>
                            </div>
                          </div>
                          <div class="right">
                            <h5
                              class="mb-1 text-normal title fw-medium text-primary-700"
                            >
                              {{ job.jobOpeningName }}
                            </h5>
                            <p class="text-sm sub-title fw-medium mb-0">
                              {{ job.companyName }}
                            </p>
                            <p class="mt-1 text-sm caption text-dark-500 d-flex align-items-center" *ngIf="getFormattedLocations(job.locations)">
                              <span class="material-symbols-outlined text-danger me-1" style="font-size: 14px;">location_on</span>
                              <span>{{ getFormattedLocations(job.locations) }}</span>
                            </p>
                          </div>
                        </li>
                      </ng-container>
                    </div>
                    <app-pagination-box
                      [totalItems]="totalItems"
                      [ItemStartIndex]="ItemStartIndex"
                      [ItemEndIndex]="ItemEndIndex"
                      [itemLimit]="itemLimit"
                      (outputParams)="getIndexParams($event)"
                    >
                    </app-pagination-box>
                  </div>
                </div>

                <div *ngIf="isJobSheet" class="right-area">
                  <app-job-detail-sheet
                  [selectedJob]="selectedJob"
                  (outParam)="handleJobSheet($event)"
                  ></app-job-detail-sheet>
                </div>

              </div>


            </div>

          </ng-container>

          <div *ngIf="!isDataAvailable && skill">
            <h6>No data found</h6>
          </div>


        </ng-container>

      </div>
    </div>
  </div>
</div>
