<div class="form-group">
    <label for="{{fieldName}}" class="form-label">{{fieldText}}<span *ngIf="isFieldRequired()" class="req text-danger font-medium ms-1">*</span></label>
    <div class="select-wrapper" (click)="showFieldItems($event)">
        <input type="text" class="form-control select" 
        #multiInputElem
        [class.active]="isExpanded"
        [placeholder]="(selectedItem && selectedItem.length > 0) ? '' : fieldPlaceholder" 
        name="{{fieldName}}" 
        [(ngModel)]="fieldModel"
        autocomplete="off" 
        [required]="checkRequired()"
        (blur)="clearModel()"
        [ngStyle]="{ 'padding-left.px': leftPadding, 'padding-top.px': topPadding }" 
        readonly />
        <span class="select-arrow" [ngClass]="isExpanded ? 'up' : 'down'"></span>
        <div class="dropdown-wrapper show" *ngIf="isExpanded">
            <div class="list-group dropdown">
                <ng-container *ngFor="let item of fieldList">
                    <li class="list-group-item" (click)="handleSelectedItem(item)"><span class="item-label">{{item[fieldType]}}</span></li>
                </ng-container>
            </div>
        </div>
        <div class="badge-list" #badgeListElem>
            <ul class="list-inline">
                <li class="list-inline-item" *ngFor="let badge of selectedItem">
                    <span>{{badge[fieldType]}}</span>
                    <i class="fa fa-times pointer" aria-hidden="true" (click)="removeBadge(badge)"></i>
                </li>
            </ul>
        </div>
    </div>
</div>
