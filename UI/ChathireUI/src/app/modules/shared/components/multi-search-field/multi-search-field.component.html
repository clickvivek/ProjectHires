<div class="form-group">
	<label for="{{fieldName}}" class="form-label">{{fieldText}}<span *ngIf="isFieldRequired()" class="req text-danger font-medium ms-1">*</span></label>
	<input type="text"
		class="form-control search multi-search"
    #multiInputElem
		[placeholder]="(selectedItem && selectedItem.length > 0) ? '' : fieldPlaceholder"
		name="{{fieldName}}"
		[(ngModel)]="fieldModel"
		(ngModelChange)="handleModelChange()"
    (keydown.enter)="handleEnterKey($event)"
    [required]="fieldRequired && selectedItem.length == 0"
    (blur)="clearModel()"
    [ngStyle]="{ 'padding-left.px': leftPadding, 'padding-top.px': topPadding, 'text-indent.px': handleTextIndent() }"
		autocomplete="off">
  <span class="search-control"><i class="fa fa-search" aria-hidden="true"></i></span>
	<div class="dropdown-wrapper show" *ngIf="isExpanded">
		<div class="list-group dropdown">
			<ng-container *ngFor="let item of fieldList">
				<li class="list-group-item pointer" (click)="handleSelectedItem(item)">{{getItemData(item)}}</li>
			</ng-container>
      <li
        class="list-group-item add-custom-item pointer text-primary-700 fw-semibold d-flex align-items-center gap-2 border-top"
        *ngIf="allowCustom && fieldModel && fieldModel.trim() && !hasExactMatch(fieldModel)"
        (mousedown)="createCustomItem($event, fieldModel)"
      >
        <span class="material-symbols-outlined fs-6 text-primary-600">add_circle</span>
        <span>Add "<strong>{{ fieldModel.trim() }}</strong>"</span>
      </li>
		</div>
	</div>
  <div class="badge-list" #badgeListElem>
    <ul class="list-inline">
      <li class="list-inline-item" *ngFor="let badge of selectedItem">
        <span>{{getSelectedItemData(badge,fieldType)}}</span>
        <i class="fa fa-times pointer" aria-hidden="true" (click)="removeBadge(badge)"></i>
      </li>
    </ul>
  </div>
</div>
