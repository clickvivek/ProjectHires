<div class="form-group">
  <label for="{{ fieldName }}" class="form-label"
    >{{ fieldText
    }}<span *ngIf="isFieldRequired()" class="req text-danger font-medium ms-1">*</span></label
  >
  <div class="select-wrapper" (click)="showFieldItems($event)">
    <input
      type="text"
      class="form-control select"
      [class.active]="isExpanded"
      placeholder="{{ fieldPlaceholder }}"
      name="{{ fieldName }}"
      [(ngModel)]="fieldModel"
      autocomplete="off"
      [required]="fieldRequired"
      readonly
    />
    <span class="select-arrow" [ngClass]="isExpanded ? 'up' : 'down'"></span>
    <div class="dropdown-wrapper show" *ngIf="isExpanded">
      <div class="list-group dropdown">
        <ng-container *ngFor="let item of fieldList">
          <li
            class="list-group-item"
            (click)="getSelectedItem(item, $event)"
            [ngClass]="isSelectedItem(item, fieldModel)"
          >
            <span class="item-label">{{ item[fieldType] }}</span>
          </li>
        </ng-container>
      </div>
    </div>
  </div>
</div>
