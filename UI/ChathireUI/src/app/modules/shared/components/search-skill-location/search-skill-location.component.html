<div class="search-skill-location-wrapper">
  <form
    #searchSkillLocationForm="ngForm"
    (ngSubmit)="submitSkillLocationForm()"
    novalidate
  >
    <div class="search-box {{page == 'home' ? 'home' : '' }} {{page == 'compact' ? 'compact-bar' : '' }}">

      <div class="search-area">
        
        <div class="item skill">
          <div class="form-group rel">
            <input
              #searchSkill
              type="text"
              class="form-control search-list"
              name="selectedSkill"
              placeholder="Job title, skill or keyword"
              [(ngModel)]="skill"
              (ngModelChange)="handleSearchSkill()"
              required
              autocomplete="off"
            />
            <span class="material-symbols-outlined icon"> search </span>
          

            <div class="dropdown-wrapper" #skillDropdown [class.show]="isSkillExpanded && skillList.length > 0">
                <ng-scrollbar
              #scrollable
              track="all"
              pointerEventsMethod="scrollbar"
              [autoHeightDisabled]="false"
              >
                <div class="list-group dropdown">
                  <ng-container
                    class="list-group"
                    *ngFor="let item of skillList"
                  >
                    <li
                      class="list-group-item"
                      (click)="getSkill(item.name, item.id)"
                    >
                      <span class="item-label">{{ item.name }}</span>
                    </li>
                  </ng-container>
                </div>
              </ng-scrollbar>
              </div>

           

          </div>
          <div class="input-field-message text-normal text-left mt-2" *ngIf="searchSkillLocationForm.submitted && searchSkillLocationForm.controls['selectedSkill'].invalid && searchSkillLocationForm.controls['selectedSkill'].errors?.['required']">
            Enter a skillset
          </div>
        </div>
  
        <div class="item location" [class.location-disabled]="isRemoteOnly">
          <div class="form-group rel">
            <input
              #searchLocation
              type="text"
              class="form-control location-search"
              name="searchJobLocation"
              [placeholder]="isRemoteOnly ? 'Remote only (Location disabled)' : 'Location or Remote'"
              [(ngModel)]="location"
              (ngModelChange)="handleSearchLocation()"
              [disabled]="isRemoteOnly"
              autocomplete="off"
            />
            <span class="material-symbols-outlined icon" [class.text-muted]="isRemoteOnly"> location_on </span>
            <div class="dropdown-wrapper" #locationDropdown [class.show]="isLocationExpanded && locationList.length > 0" [class.d-none]="isRemoteOnly">
              
              <ng-scrollbar
              #scrollable
              track="all"
              pointerEventsMethod="scrollbar"
              [autoHeightDisabled]="false"
              >

                <div class="list-group dropdown">
                  <ng-container
                    class="list-group"
                    *ngFor="
                      let item of locationList
                    "
                  >
                    <li
                      class="list-group-item"
                      (click)="getLocation(item)"
                    >
                      <span class="item-label">{{ formatLocation(item) }}</span>
                    </li>
                  </ng-container>
                </div>

              </ng-scrollbar>

            </div>
          </div>
        </div>

        <!-- Radius dropdown (for Job search with location) -->
        <div class="item radius" *ngIf="type === 'jobs'" [class.location-disabled]="isRemoteOnly">
          <div class="form-group rel">
            <select
              class="form-select radius-select"
              name="radiusMilesSelect"
              [(ngModel)]="radiusMiles"
              [disabled]="isRemoteOnly"
              (ngModelChange)="radiusMilesChange.emit(radiusMiles)"
            >
              <option [ngValue]="50">50 miles</option>
              <option [ngValue]="100">100 miles</option>
              <option [ngValue]="150">150 miles</option>
              <option [ngValue]="200">200 miles</option>
            </select>
          </div>
        </div>

        <button type="submit" class="item go-btn submit-btn fw-bold px-4 text-white text-uppercase d-inline-flex align-items-center justify-content-center gap-2" *ngIf="page == 'home' || page == 'compact'" style="border-radius: 6px;" [disabled]="isSearching">
          <span *ngIf="isSearching" class="spinner-border spinner-border-sm me-1" role="status" aria-hidden="true"></span>
          <span class="d-md-none text-base">{{ isSearching ? 'Searching...' : (page == 'compact' ? 'Search' : ('Search ' + (type == 'jobs' ? 'Jobs' : 'Talent'))) }}</span>
          <span class="d-none d-md-block">{{ isSearching ? 'SEARCHING...' : (page == 'compact' ? 'SEARCH' : ('SEARCH ' + (type == 'jobs' ? 'JOBS' : 'TALENT'))) }}</span>
        </button>

      </div>

      <!-- Remote only checkbox (applicable for jobs search, hidden on compact page since it is rendered in filter ribbon) -->
      <div class="remote-checkbox-bar mt-2 d-flex align-items-center justify-content-center" *ngIf="type === 'jobs' && page !== 'compact'">
        <div class="form-check d-inline-flex align-items-center gap-2 m-0 cursor-pointer">
          <input
            class="form-check-input cursor-pointer"
            type="checkbox"
            id="searchRemoteOnlyCheck"
            name="isRemoteOnly"
            [(ngModel)]="isRemoteOnly"
            (change)="onRemoteChange()"
          />
          <label class="form-check-label fw-semibold text-dark-700 cursor-pointer select-none" for="searchRemoteOnlyCheck" style="font-size: 13.5px;">
            Remote jobs only
          </label>
        </div>
      </div>

      <div class="search-btn-box" *ngIf="page != 'home' && page != 'compact'">
        <button type="submit" class="btn btn-primary submit-btn d-inline-flex align-items-center justify-content-center gap-2" [disabled]="isSearching">
          <span *ngIf="isSearching" class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span>
          <span>{{ isSearching ? 'Searching...' : ('Search ' + (type == 'jobs' ? 'Jobs' : 'Resumes / Hotlist')) }}</span>
        </button>
      </div>

     
      
    </div>


  </form>
</div>
