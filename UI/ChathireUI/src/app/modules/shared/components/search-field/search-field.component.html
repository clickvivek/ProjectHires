<div class="form-group">
	<label for="{{fieldName}}" class="form-label">{{fieldText}}<span *ngIf="isFieldRequired()" class="req text-danger font-medium ms-1">*</span></label>
	<input type="text"
		class="form-control search"
		placeholder="{{fieldPlaceholder}}"
		name="{{fieldName}}"
		[(ngModel)]="fieldModel"
		(ngModelChange)="handleModelChange()"
    	[required]="fieldRequired"
		[disabled]="fieldDisabled"
		autocomplete="new-password"
		data-lpignore="true"
		autocorrect="off"
		autocapitalize="off"
		spellcheck="false">
	<span class="search-control" (click)="clearList()" *ngIf="!fieldDisabled">
    <i class="fa fa-search" aria-hidden="true" *ngIf="!selectedItem"></i>
    <i class="fa fa-times pointer" aria-hidden="true" *ngIf="selectedItem"></i>
  </span>
	<div class="dropdown-wrapper show" *ngIf="isExpanded && fieldList && fieldList.length > 0">
		<div class="list-group dropdown">
			<ng-container *ngFor="let item of fieldList; let i = index">
				<li class="list-group-item search-suggestion-item" (click)="getSelectedItem(item)">
					<!-- Company Search Item with Logo -->
					<div *ngIf="isCompanyItem(item)" class="d-flex align-items-center gap-2 w-100">
						<div class="company-logo-avatar flex-shrink-0">
							<img
								*ngIf="item.logo && !hasLogoError(item.id || i)"
								[src]="getLogoUrl(item.logo)"
								[alt]="getItemData(item)"
								class="company-logo-img rounded border"
								(error)="onLogoError(item.id || i)"
							/>
							<div *ngIf="!item.logo || hasLogoError(item.id || i)" class="company-logo-fallback rounded">
								<span>{{ getInitials(getItemData(item)) }}</span>
							</div>
						</div>
						<div class="company-details flex-grow-1 min-w-0">
							<div class="company-name text-truncate fw-medium d-flex align-items-center flex-wrap gap-1">
								<span class="text-dark">{{ getItemData(item) }}</span>
								<span *ngIf="item.website" class="company-website text-muted text-xs fw-normal">({{ formatWebsite(item.website) }})</span>
							</div>
							<div class="company-domain text-muted text-xs text-truncate" *ngIf="item.domainname">
								{{ item.domainname }}
							</div>
						</div>
					</div>

					<!-- Standard / Location Item -->
					<div *ngIf="!isCompanyItem(item)" class="d-flex align-items-center gap-2">
						<span>{{ getItemData(item) }}</span>
					</div>
				</li>
			</ng-container>
		</div>
	</div>
	<div class="dropdown-wrapper show" *ngIf="isExpanded && showCreateOption && (!fieldList || fieldList.length === 0)">
		<div class="list-group dropdown">
			<div class="p-3 text-center bg-white">
				<p class="text-muted text-xs mb-2">No matching company found</p>
				<button type="button" class="btn btn-sm btn-purple-outline d-inline-flex align-items-center gap-1" (click)="triggerCreateNew($event)">
					<i class="fa fa-plus-circle"></i>
					<span>+ Create New Company</span>
				</button>
			</div>
		</div>
	</div>
</div>
