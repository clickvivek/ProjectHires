<div class="download-box">
  <a #anchor class="d-none" [href]="fileUrl" target="_blank"></a>
  <div class="inner d-flex align-items-center" (click)="handleDownload(anchor)">
    <span class="material-symbols-outlined icon text-base me-1">
      download
    </span>
    <span class="text-sm">download resume</span>
  </div>
</div>
