<div class="posting-history-wrapper">
    
    <div class="container">
        <div class="row">
            <div class="col-sm-12">
                
                <loader *ngIf="!isLoaded"></loader>
                
                <ng-container *ngIf="isLoaded">

                    <div class="row">
                        <div class="col-lg-6">
                            <h5 class="mb-3 text-secondary-800">List of jobs posted by you in last 90 days</h5>
                            <page-search (outputData)="handleSearch($event)"  placeholder="Search by job, location" ></page-search>
                        </div>
                    </div>

                    <ng-container *ngIf="isDataAvailable()">

                        <div class="options-box">
                            <h6>{{totalItems}} results available </h6>
                        </div>

                        <div class="list-container">
                            <posting-history-list 
                            *ngFor=" let posting of filteredDataList | slice : ItemStartIndex : ItemEndIndex" 
                            [item]="posting"
                            (deleteParams)="onDeletePost($event)">
                        </posting-history-list>
                        </div>

                        <app-pagination-box
                            [totalItems]="totalItems"
                            [ItemStartIndex]="ItemStartIndex"
                            [ItemEndIndex]="ItemEndIndex"
                            [itemLimit]="itemLimit"
                            (outputParams)="getIndexParams($event)"
                        >
                        </app-pagination-box>

                    </ng-container>
                    
                    
                    <div class="options-box" *ngIf="!isDataAvailable()">
                        <h6 *ngIf="!isError">No data found</h6>
                        <div class="row" *ngIf="isError">
                            <div class="col-lg-6">
                                <div class="alert alert-danger">{{error}}</div>
                            </div>
                        </div>
                    </div>

                </ng-container>

                

            </div>
        </div>
    </div>

    <router-outlet></router-outlet>

</div>
