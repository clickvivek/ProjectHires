<div class="posting-history-list-wrapper">
    <li class="list-group-item shadow">
        <div class="top">
            <p class="text-secondary-800 text-base desp fw-medium">
                {{ item.name }}
            </p>
            <p
            class="text-dark-600 desp fw-medium d-none d-md-block"
          >
            {{ getRelocation(item?.jobOpeningLocations) }}
          </p>
          <div class="desp ms-auto">
            <slider-classic [data]="item.active" [selectedItem]="item" activeText="Active" inActiveText="Inactive" (outputparams)="handleActive($event)"></slider-classic>
          </div>
        </div>
        <div class="bottom">
            <p
            class="text-dark-600 desp fw-medium d-md-none"
          >
            {{ getRelocation(item?.jobOpeningLocations) }}
          </p>
            <p
            class="text-dark-400 text-sm desp"
            >
            posted on {{getDate(item.postedDate)}}
            </p>
            <div class="mt-3 d-flex align-items-center">
                <div class="d-flex align-items-center pointer me-3" (click)="editPost(item)">
                    <span class="material-symbols-outlined text-sm me-2">edit</span>
                    <p class="text-sm">Edit</p>
                </div>
    
                <div class="d-flex align-items-center text-danger pointer me-3" (click)="deletePost(item)">
                    <span class="material-symbols-outlined text-sm me-2">delete</span>
                    <p class="text-sm">Delete</p>
                </div>
            </div>
        </div>
    </li>
</div>
