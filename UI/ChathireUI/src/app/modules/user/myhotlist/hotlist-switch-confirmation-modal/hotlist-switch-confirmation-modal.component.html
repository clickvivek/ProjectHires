<div class="modal-wrapper p-5">
  <div class="content text-center">
    <h6 class="ft-head">Do you want to {{statusId == 2 ? 'start' : 'stop'}} marketing this resume? Please confirm</h6>
    <div class="mt-4">
      <div class="btn btn-primary text-normal me-4" mat-button [mat-dialog-close]="true">Yes</div>
      <div class="btn btn-secondary text-normal" mat-button [mat-dialog-close]="false">No</div>
    </div>
  </div>
</div>
